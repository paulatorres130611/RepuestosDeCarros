<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autopartes El Sótano</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at top center, rgba(142, 255, 56, 0.12), transparent 18%),
        radial-gradient(circle at bottom right, rgba(142, 255, 56, 0.08), transparent 20%),
        linear-gradient(180deg, #030303 0%, #0b0b0b 45%, #14181d 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      opacity: 0.25;
    }

    .main-wrapper {
      max-width: 1280px;
      margin: 0 auto;
      padding: 38px 24px 55px;
      position: relative;
      z-index: 1;
    }

    .hero-section {
      text-align: center;
      margin-bottom: 42px;
      padding: 10px 0 5px;
    }

    .logo-frame {
      display: inline-block;
      padding: 16px;
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid rgba(142,255,56,0.30);
      box-shadow:
        0 0 0 1px rgba(142,255,56,0.06),
        0 18px 50px rgba(0,0,0,0.55),
        0 0 28px rgba(142,255,56,0.10),
        inset 0 0 18px rgba(142,255,56,0.06);
      margin-bottom: 22px;
      animation: glowPulse 3s ease-in-out infinite;
    }

    .logo-img {
      width: 250px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 22px;
      display: block;
      filter: drop-shadow(0 0 10px rgba(142,255,56,0.12));
    }

    .brand-title {
      margin: 0;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #9dff4f;
      text-shadow:
        0 0 8px rgba(157,255,79,0.20),
        0 0 20px rgba(157,255,79,0.10);
    }

    .brand-line {
      width: 180px;
      height: 4px;
      margin: 14px auto 0;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #8eff38, transparent);
      box-shadow: 0 0 14px rgba(142,255,56,0.35);
    }

    .dashboard-box {
      background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 30px;
      padding: 34px 28px;
      backdrop-filter: blur(10px);
      box-shadow:
        0 18px 45px rgba(0,0,0,0.32),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .section-title {
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 26px;
      text-align: center;
      letter-spacing: 0.6px;
    }

    .menu-card {
      display: block;
      text-decoration: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.045));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px 22px;
      height: 100%;
      transition: all 0.30s ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.20);
      position: relative;
      overflow: hidden;
    }

    .menu-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(255,255,255,0.08) 50%,
        transparent 100%
      );
      transition: all 0.6s ease;
    }

    .menu-card:hover::before {
      left: 120%;
    }

    .menu-card:hover {
      transform: translateY(-8px) scale(1.01);
      border-color: rgba(142,255,56,0.55);
      box-shadow:
        0 18px 35px rgba(0,0,0,0.30),
        0 0 22px rgba(142,255,56,0.08);
    }

    .menu-icon {
      width: 82px;
      height: 82px;
      border-radius: 24px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 2rem;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 10px 20px rgba(0,0,0,0.18);
    }

    .icon-productos {
      background: linear-gradient(135deg, #1f1f1f, #555555);
    }

    .icon-proveedores {
      background: linear-gradient(135deg, #5c646d, #939aa3);
    }

    .icon-clientes {
      background: linear-gradient(135deg, #256f24, #8eff38);
    }

    .icon-ventas {
      background: linear-gradient(135deg, #0f5132, #20c997);
    }

    .icon-compras {
      background: linear-gradient(135deg, #4c5258, #adb5bd);
    }

    .menu-title {
      text-align: center;
      color: #ffffff;
      font-size: 1.22rem;
      font-weight: 800;
      margin-bottom: 9px;
      letter-spacing: 0.3px;
    }

    .menu-text {
      text-align: center;
      color: #cdd3db;
      font-size: 0.95rem;
      margin: 0;
      line-height: 1.5;
    }

    @keyframes glowPulse {
      0%,
      100% {
        box-shadow:
          0 0 0 1px rgba(142,255,56,0.06),
          0 18px 50px rgba(0,0,0,0.55),
          0 0 20px rgba(142,255,56,0.08),
          inset 0 0 18px rgba(142,255,56,0.06);
      }

      50% {
        box-shadow:
          0 0 0 1px rgba(142,255,56,0.10),
          0 18px 50px rgba(0,0,0,0.55),
          0 0 30px rgba(142,255,56,0.18),
          inset 0 0 22px rgba(142,255,56,0.09);
      }
    }

    @media (max-width: 768px) {
      .brand-title {
        font-size: 2.2rem;
      }

      .logo-img {
        width: 210px;
      }

      .dashboard-box {
        padding: 26px 18px;
      }
    }
  </style>
</head>
<body>

<div class="main-wrapper">

  <section class="hero-section">
    <div class="logo-frame">
      <img th:src="@{/images/logo.png}" alt="Logo El Sótano" class="logo-img">
    </div>

    <h1 class="brand-title">Autopartes El Sótano</h1>
    <div class="brand-line"></div>
  </section>

  <section class="dashboard-box">
    <h2 class="section-title">Panel principal</h2>

    <div class="row g-4">

      <div class="col-12 col-md-6 col-lg-4">
        <a class="menu-card" th:href="@{/productos}">
          <div class="menu-icon icon-productos">
            <i class="fas fa-cogs"></i>
          </div>
          <div class="menu-title">Productos</div>
          <p class="menu-text">Consulta y administra el inventario de repuestos</p>
        </a>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <a class="menu-card" th:href="@{/proveedores}">
          <div class="menu-icon icon-proveedores">
            <i class="fas fa-truck"></i>
          </div>
          <div class="menu-title">Proveedores</div>
          <p class="menu-text">Gestiona proveedores y su información</p>
        </a>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <a class="menu-card" th:href="@{/clientes}">
          <div class="menu-icon icon-clientes">
            <i class="fas fa-user"></i>
          </div>
          <div class="menu-title">Clientes</div>
          <p class="menu-text">Administra clientes fácilmente</p>
        </a>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <a class="menu-card" th:href="@{/ventas}">
          <div class="menu-icon icon-ventas">
            <i class="fas fa-shopping-cart"></i>
          </div>
          <div class="menu-title">Ventas</div>
          <p class="menu-text">Registra ventas y salidas de stock</p>
        </a>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <a class="menu-card" th:href="@{/compras}">
          <div class="menu-icon icon-compras">
            <i class="fas fa-receipt"></i>
          </div>
          <div class="menu-title">Compras</div>
          <p class="menu-text">Registra compras y entradas</p>
        </a>
      </div>

    </div>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
